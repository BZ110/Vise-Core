  rtp:
    description: Randomly teleport
    permission: core.rtp
    aliases: [ randomtp, randomteleport ]


  tpa:
    description: Request to teleport to someone
    permission: core.tpa

  tpahere:
    description: Request someone to teleport to you
    permission: core.tpahere

  tpaccept:
    description: Accept a teleport request from a player
    usage: /tpaccept <player>
    permission: core.tpaccept

  changecategorylogo:
    description: Change the icon/logo of a custom kit category
    usage: /changecategorylogo <name>
    permission: core.changecategorylogo

  categorylist:
    description: List categories
    usage: /listcategories
    permission: core.listcategories

  back:
    description: Go back to your death location
    usage: /back
    permission: core.back



  # LAVA TIME
  lavasetspawn:
    description: Set lava spawn
    usage: /lavasetspawn
    permission: core.setspawn

  lavaspawn:
    description: Go to the lava spawn
    usage: /lavaspawn
    aliases: [ event ]
    permission: core.spawn

  lavaarena:
    description: Create / edit Lava Rising arenas
    permission: core.lavaarena
    usage: /lavaarena

  lavaforcestart:
    description: Force‑start a Lava Rising match
    permission: core.lavaforcestart
    usage: /lavaforcestart

  ffa:
    description: Go to an FFA map.
    permission: core.ffa
    usage: /ffa
  ffaadmin:
    description: Utilize FFA Admin commands.
    permission: core.ffaadmin
    usage: /ffaadmin
  ffakiteditor:
    description: Open FFA kit editor
    usage: /ffakiteditor
    permission: core.ffakiteditor

  kiteditor:
    description: Open the regular kit editor
    usage: /kiteditor
    permission: core.kiteditor

  setpageduelkitcategory:
    description: Set categories for duels
    usage: /setpageduelkitcategory
    permission: core.setpageduelkitcategory

  deletepageduelkitcategory:
    description: Delete a category for duels
    usage: /deletepageduelkitcategory
    permission: core.deletepageduelkitcategory

  automatecombat:
    description: Open the experimental NPC practice menu
    usage: /automatecombat
    permission: core.automatecombat

  armortrim:
    description: Select and apply your favorite armor trims.
    usage: /armortrim
    aliases: [ trims, armortrims ]
    permission: core.armortrim

  deatheffects:
    description: Select and customize your death effect cosmetic.
    usage: /deatheffects
    aliases: [ deatheffect, de ]
    permission: core.deatheffects

  profile:
    description: View a player's profile and information.
    usage: /profile [player]
    permission: core.profile
    aliases: [ pinfo, user, whois, lookup ]
  rankedqueue:
    description: Join the ranked matchmaking queue.
    permission: core.ranked

  rankedlb:
    description: View the ranked leaderboard.
    permission: core.ranked

  rankedadmin:
    description: Administrative ranked settings.
    permission: core.rankedadmin

  seegames:
    description: View recent ranked matches for a player.
    permission: core.ranked

  matchinfo:
    description: View detailed information for a specific match.
    permission: core.ranked

  rankedreport:
    description: Generate an HTML report for a specific ranked match.
    permission: core.ranked

  autorestart:
    description: Configure server restarts.
    permission: core.autorestart
    usage: /autorestart

  tournament:
    description: Manage and join tournaments.
    permission: core.tournament
    usage: /tournament
    aliases: [ tourney ]

  next:
    description: Spectate or manage the next match in a tournament.
    permission: core.tournament
    usage: /next
