name: Core
version: '${version}'
main: org.albi.core.Core
author: "CriticalKing"
description: "Vise Core PvP, matchmaking and lobby tools"
api-version: '1.21'

softdepend:
  - FeatherServerAPI
  - PlaceholderAPI
  - FastAsyncWorldEdit
  - WorldEdit
  - polarpaper

commands:

  bypass:
    description: The ability to bypass block usage in the lobby.
    usage: /bypass
    permission: core.bypass

  fly:
    description: Toggle flight.
    usage: /fly
    permission: core.fly

  gmc:
    description: Switch to Creative mode
    permission: core.gmc
  gms:
    description: Switch to Survival mode
    permission: core.gms
  gma:
    description: Switch to Adventure mode
    permission: core.gma
  gmsp:
    description: Switch to Spectator mode
    permission: core.gmsp

  vanish:
    description: Toggle vanish mode
    permission: core.vanish
    permission-message: ""

  spawn:
    description: Go to spawn
    permission: core.spawn
    aliases: [ exit, leave, ff ]

  setspawn:
    description: Set the spawn
    permission: core.setspawn
  setspawnitem:
    description: Define a lobby spawn item linked to a command
    permission: core.setspawnitem

  msg:
    description: Private message a player
    permission: core.msg
    aliases: [ tell, whisper ]
  r:
    description: Reply to the last private message
    permission: core.msg
  block:
    description: Block a player from private messages
    permission: core.block
  unblock:
    description: Unblock a previously blocked player
    permission: core.block

  rules:
    description: The rules of the server.
    permission: core.rules

  dueladmin:
    description: The duel admin command.
    permission: core.dueladmin

  setkitdata:
    description: Set sensitive data for kits
    permission: core.dueladmin

  duel:
    description: Duel command.
    permission: core.duel

  acceptduel:
    description: Accepts a duel, usually an internal command.
    permission: core.duel

  party:
    description: The basic party command.
    permission: core.party
    aliases: [ p ]

  lobbyplayers:
    description: Hide or show other players in the lobby world.
    permission: core.lobbyplayers
    aliases: [ lobbyp ]

  partyduelaccept:
    description: Accept a party duel.
    permission: core.partyduelaccept
    aliases: [ pda ]

  customkit:
    description: Opens the custom kit menu.
    permission: core.customkit
    aliases: [ ckit, ck, k ]

  createcustomkitcategory:
    permission: core.customkitcategoryediting

  setitemincustomkitcategory:
    permission: core.customkitcategoryediting

  deletecustomkitcategory:
    permission: core.customkitcategoryediting

  copykit:
    description: Copy a shared kit into an empty slot
    permission: core.copykit

  discord:
    description: Link and unlink account, get discord.
    permission: core.discord

  queue:
    description: Allows /queue
    permission: core.queue

  quickqueue:
    description: Queue into any available kit
    permission: core.quickqueue

  friends:
    description: Open and manage your friends list
    permission: core.friends
    aliases: [ friend, f ]

  travel:
    description: Allows you to travel between servers
    permission: core.travel

  health:
    description: Display server health
    permission: core.health

  stats:
    description: See your stats
    permission: core.stats
    aliases: [ statistics, playerstats, ps ]

  settings:
    description: Edit your user settings
    permission: core.settings
    aliases: [ set, s, options ]

  goto:
    description: Go to an area in the lobby.
    permission: core.goto

  setgoto:
    description: Edit that GUI.
    permission: core.setgoto

  spectate:
    description: Spectate a player in a duel
    permission: core.spectate

  store:
    description: Open the store
    permission: core.store

  leaderboard:
    description: See the leaderboard
    permission: core.leaderboard
    aliases: [ lb, topstats, topstatistics ]

