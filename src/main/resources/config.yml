  # Duel Admin Commands
  # Probably don't want to change these, as they act as a guide to serve the player.
  duel_admin_begin: "&7Duel‑Setup Wizard\n&f• &e/dueladmin arena <id> &7→ build arenas\n&f• &e/dueladmin kit <id> &7→ make kits"

  # ─────────── ARENA GUIDE ───────────
  duel_admin_arena: "&7Arena Setup Commands:\n&f✓ &e/dueladmin arena create <id> &7→ Create a new arena\n&f✓ &e/dueladmin arena arenaready <id> &7→ Link the Multiverse world\n&f✓ &e/dueladmin arena setdisplayitem <id> &7→ Set icon in GUI\n&f✓ &e/dueladmin arena setspawn <id> <1|2> &7→ Set team spawn point\n&f✓ &e/dueladmin arena setcorner <id> <x1|z1|x2|z2> <value> &7→ Define arena bounds\n&f✓ &e/dueladmin arena setschematic <id> <file> &7→ Set schematic file\n&f✓ &e/dueladmin arena setoffset <id> <x|z> <blocks> &7→ Set schematic spacing\n&f✓ &e/dueladmin arena setmax <id> <perline|maxarenas> <num> &7→ Set grid size\n&f✓ &e/dueladmin arena info <id> &7→ View full arena info"

  duel_admin_arena_proper_name: "&7Specify an arena name."
  duel_admin_arena_exists: "&cThat arena already exists."

  duel_admin_arena_one: "&a✔ Arena &e{1}&a created\n&f1) Make its world: &e/mv create {1}-duel normal -g VoidGen\n&f2) Unload world: &e/mv unload {1}-duel\nNext ➜ &e/dueladmin arena arenaready {1}"

  duel_admin_arena_ready: "&aWorld linked!\nHold the arena icon in your hand.\nNext ➜ &e/dueladmin arena setdisplayitem {1}"

  duel_admin_arena_two: "&aIcon saved.\nStand at &9Team‑1 &fspawn.\nNext ➜ &e/dueladmin arena setspawn {1} 1\n\n&r&7To do this, we recommend creating a world called &earenacreation&7 with the command &e/mv create arenacreation -g VoidGen &7- Go to this world, then spawn the schematic at 0, 0, 0. Then use these commands. Ensure you use commands such as /tp and center your yaw and pitch."

  duel_admin_arena_setspawn_usage: "&7Usage: /dueladmin arena setspawn <name> <1|2>"
