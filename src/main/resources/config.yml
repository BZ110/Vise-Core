# Vise Core configuration. Restart Paper after editing this file.
# For migrations, copy new settings into your existing plugins/Core/config.yml.

# Region and ID identify this instance to Redis and to a BungeeCord-compatible proxy.
name: "Vise Core"
ip: "localhost"
region: EU
id_number: 1
lobby_world: world
lobby_max_height: 150
max_entities: 30
c_worlds: []
ffa_worlds: []

# Set up MySQL and Redis before starting. Environment variables override YAML.
mysql:
  host: "127.0.0.1"
  port: 3306
  database: "vise_core"
  user: "vise_core"
  password: ""
  ssl: false
  ssl_mode: "" # Optional Connector/J mode. Blank uses the legacy ssl flag.
  pool_size: 20

redis:
  host: "127.0.0.1"
  port: 6379
  password: ""
  ssl: false
  ca_file: "" # With TLS, blank uses certs/ca.crt if present or the JVM trust store.

storage:
  flush_interval_seconds: 600

modules:
  Duels: true
  Party: true
  FFA: true
  CustomKit: true
  Friends: true
  LavaRising: false
  CriticalDiscord: false
  Tournaments: false
  KnockbackSynchronization: true
  AntiGhostArrow: true

network:
  global_chat: true
  store_url: ""
  discord_url: ""
  matchmaking:
    # Enable on every participating Paper server behind the same proxy network.
    enabled: false
    namespace: "default"
    server_id: "" # Exact proxy registration. Blank uses the lowercase region-id_number name.
    pool: "" # Blank uses region. Set a location such as eu-east on each participating server.
    host_matches: true # Set false for queue-only servers with no network arenas.

    # Every step opens one more destination for each player. Region gates apply independently.
    priority_step_seconds: 8
    cross_region_after_seconds: 45
    unlisted_after_seconds: -1 # -1 requires an explicit route in pools.
    ping:
      start_ms: 110
      max_ms: 260
      gap_start_ms: 45
      gap_max_ms: 130
      relax_every_seconds: 5
      relax_by_ms: 15
      # Added to the observed source ping when no origin-to-destination value is configured.
      same_region_add_ms: 25
      cross_region_add_ms: 100

    poll_ticks: 10
    scan_size: 128
    offers_per_poll: 12
    pending_per_host: 12

    pools:
      eu-east:
        region: eu
        priority: [eu-central, eu-west, middle-east, na-east, asia-central]
        latency_ms: {eu-central: 20, eu-west: 35, middle-east: 65, na-east: 100, asia-central: 130}
      eu-central:
        region: eu
        priority: [eu-east, eu-west, middle-east, na-east, asia-central]
        latency_ms: {eu-east: 20, eu-west: 20, middle-east: 65, na-east: 90, asia-central: 145}
      eu-west:
        region: eu
        priority: [eu-central, eu-east, na-east, middle-east, asia-central]
        latency_ms: {eu-central: 20, eu-east: 35, na-east: 75, middle-east: 80, asia-central: 160}
      middle-east:
        region: middle-east
        priority: [eu-east, eu-central, eu-west, asia-central, na-east]
        latency_ms: {eu-east: 65, eu-central: 65, eu-west: 80, asia-central: 75, na-east: 150}
      na-east:
        region: na
        priority: [eu-west, eu-central, eu-east, middle-east, asia-central]
        latency_ms: {eu-west: 75, eu-central: 90, eu-east: 100, middle-east: 150, asia-central: 170}
      asia-central:
        region: asia
        priority: [middle-east, eu-east, eu-central, eu-west, na-east]
        latency_ms: {middle-east: 75, eu-east: 130, eu-central: 145, eu-west: 160, na-east: 170}
  travel:
    # Same-region instance transfers use the proxy. Add destinations here for direct transfers.
    regions: {}
    # Example entry under regions (use the identifier from the target server's region setting):
    # NA:
    #   name: "North America"
    #   location: "New York"
    #   host: "na.example.net"
    #   port: 25565
    #   texture_url: "" # Optional textures.minecraft.net player-head URL

autorestart:
  enabled: false
  interval_hours: 24

announcements:
  enabled: true
  interval_seconds: 180
  messages:
    - "&7Use &f/quickqueue &7to join an active queue."
    - "&7Use &f/friends &7to manage your friends list."
    - "&7Edit your layout with &f/customkit &7and preferences with &f/settings&7."

# Optional alternate arena backend. Install a compatible PolarPaper build first.
use_polar_worlds: false
polar_preload: 2

duels:
  tnt_seconds: 3
  default_rounds: 1
  rounds: [1, 2, 3, 4, 5, 10, 15, 18, 20]

  # Experimental. The practice NPC uses Paper server internals and can break
  # after an update. Test it on a staging server before enabling it.
  bots:
    enabled: false
    max_sessions: 4
    allowed_kits: ["beast", "pot"]
    default_rounds: 1
    debug_logging: false

ranked:
  webhook_url: "" # VISE_RANKED_WEBHOOK_URL
  report_url_template: "" # Optional URL with a {match_id} placeholder
  placement_matches: 5
  history_expiry_days: 7

lava_rising:
  lava_rising_world: lavaevent
  time_finish: 900
  time_pvp: 330
  time_lava_start: 10
  time_lava_rise: 3
  auto_interval_ticks: 0 # Zero disables automatic starts.
  webhook_url: "" # VISE_LAVA_WEBHOOK_URL
  webhook_warn_seconds: 30
  pregame:
    required_players: 5
    spectate_height: 100
    lobby_wait_seconds: 60
    reminder_interval_seconds: 10
  starter_items:
    - ENCHANTING_TABLE
    - BOOKSHELF:8
    - IRON_BLOCK:3
    - GOLD_BLOCK:2
    - APPLE:9
    - OAK_LOG:16
    - COOKED_BEEF:8

tournaments:
  challonge_username: "" # VISE_CHALLONGE_USERNAME
  challonge_api_key: "" # VISE_CHALLONGE_API_KEY

cooldowns:
  bypass: 5
  fly: 2
  gma: 1
  gms: 1
  gmsp: 1
  gmc: 1
  msg: 3
  setspawn: 5
  setspawnitem: 5
  rules: 3
  spawn: 4
  vanish: 1
  duel: 10
  duelaccept: 1
  party: 1
  automatecombat: 3
  travel: 3

# List kit IDs to opt into these combat rules.
33_percent_boost: ["pot", "mctiersio.pot"]
mending_rngs: ["subtiers.debuff", "mctierscom.smp", "diamondsmp"]

# Add the words and phrases you want your server's chat filter to block.
bad_words: []

guis:
  duel:
    kitselector:
      name: "&bSelect a Kit"
      rows: 3
      offset: 0
    mainselector:
      name: "&bMore Options"
      rows: 1
      offset: 0
    arenaselector:
      name: "&bSelect an Arena"
      rows: 3
      offset: 0
    roundselector:
      name: "&bSelect Rounds"
      rows: 1
      offset: 0

# Chat line format.
