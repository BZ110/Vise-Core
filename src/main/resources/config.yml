# Vise Core configuration. Restart Paper after editing this file.
# For migrations, copy new settings into your existing plugins/Core/config.yml.

# Region and ID identify this instance to Redis and to a BungeeCord-compatible proxy.
name: "Vise Core"
ip: "localhost"
region: EU
id_number: 1
lobby_world: world
lobby_max_height: 150
max_entities: 30
c_worlds: []
ffa_worlds: []

lobby:
  join:
    teleport: true
    reset_player: true
    hide_join_message: true
    hide_quit_message: true
    warm_tier_profiles: true
  protection:
    block_placement: true
    block_breaking: true
    item_drops: true
    item_pickup: true
    interactions: true
    block_player_heads_outside_lobby: true
    height_limit: true # Uses lobby_max_height.
    pvp: true # Applies when the Duels module is active.
  hotbar:
    enabled: true # Use gui.yml to style, move, or replace shortcuts for each lobby state.
    cooldown_seconds: 1.0
  movement:
    speed_level: 2 # 0 disables this lobby effect.
    jump_boost_level: 2
  elytra:
    enabled: true
    unbreakable: true
    unbreaking_level: 1
    wind_charges: 64 # 0 disables auto-equip.
  interaction:
    right_click_duel: true
    right_click_duel_cooldown_ms: 250
    sneak_tab_toggle: true
    shulker_editor: true
    physical_triggers: false
    allowed_items: [FISHING_ROD, WIND_CHARGE]
  wind_charges:
    protect_blocks: true
    boost: true
    radius: 2.0
    horizontal_velocity: 1.0
    vertical_velocity: 1.25

world_rules:
  enabled: true
  apply_on_world_load: false # Apply to worlds loaded later as well as those present at server startup.
  lobby:
    enabled: true
    inherit_defaults: true
    difficulty: inherit
    gamerules:
      doWeatherCycle: false
      doMobSpawning: false
      announceAdvancements: false
  other:
    enabled: true
    inherit_defaults: true
    difficulty: HARD
    gamerules:
      keepInventory: true
      doImmediateRespawn: true
      doDaylightCycle: false
      doWeatherCycle: false
      doMobSpawning: false
      announceAdvancements: false
  worlds: {}
  # Examples under worlds:
  #   survival: {enabled: false}
  #   practice: {inherit: false, difficulty: NORMAL, gamerules: {naturalRegeneration: false}}

# Set up MySQL and Redis before starting. Environment variables override YAML.
mysql:
  host: "127.0.0.1"
  port: 3306
  database: "vise_core"
  user: "vise_core"
  password: ""
  ssl: false
  ssl_mode: "" # Optional Connector/J mode. Blank uses the legacy ssl flag.
  pool_size: 20
  connect_timeout_ms: 5000
  socket_timeout_ms: 8000
  connection_timeout_ms: 5000 # Maximum wait for a pooled MySQL connection.

redis:
  host: "127.0.0.1"
  port: 6379
  password: ""
  ssl: false
  ca_file: "" # With TLS, blank uses certs/ca.crt if present or the JVM trust store.
  pool_size: 16
  min_idle: 2
  timeout_ms: 8000
  borrow_timeout_seconds: 10

storage:
  flush_interval_seconds: 600
  shutdown_timeout_seconds: 15 # Maximum wait for queued writes and the final MySQL flush.

modules:
  Duels: true
  Party: true
  FFA: true
  CustomKit: true
  Friends: true
  LavaRising: false
  CriticalDiscord: false
  Tournaments: false
  KnockbackSynchronization: true
  AntiGhostArrow: true

network:
  global_chat: true
  store_url: ""
  discord_url: ""
  matchmaking:
    # Enable on every participating Paper server behind the same proxy network.
    enabled: false
    namespace: "default"
    server_id: "" # Exact proxy registration. Blank uses the lowercase region-id_number name.
    pool: "" # Blank uses a known region or a location-prefixed proxy ID such as eu-east-1.
    use_default_pools: true # Worldwide regions, routes, and latency estimates are bundled.
    host_matches: true # Set false for queue-only servers with no network arenas.
    return_after_match: true # Send fighters back to the server they queued on.

    # Built-in routes open in tiers. An explicit priority list opens one destination per step.
    priority_step_seconds: 8
    cross_region_after_seconds: 45
    unlisted_after_seconds: -1 # -1 requires an explicit route in pools.
    ping:
      start_ms: 110
      max_ms: 260
      gap_start_ms: 45
      gap_max_ms: 130
      relax_every_seconds: 5
      relax_by_ms: 15
      # Added to the observed source ping when no origin-to-destination value is configured.
      same_region_add_ms: 25
      cross_region_add_ms: 100

    poll_ticks: 10
    scan_size: 128
    offers_per_poll: 12
    pending_per_host: 12

    # Optional per-pool edits. Keep empty to use the bundled worldwide catalog.
    # An explicit priority replaces that pool's built-in order. An empty list keeps it local.
    # Add a measured estimate to latency_ms without replacing the default priority tiers.
    pools: {}
  spectating:
    enabled: true # Redis-backed cross-server spectating with global matchmaking.
  health:
    enabled: true
    sample_interval_ticks: 100
    max_samples: 17280
    include_worlds: true
  travel:
    refresh_ticks: 100
    offline_after_seconds: 10
    # Same-region instance transfers use the proxy. Add destinations here for direct transfers.
    regions: {}
    # Example entry under regions (use the identifier from the target server's region setting):
    # NA:
    #   name: "North America"
    #   location: "New York"
    #   host: "na.example.net"
    #   port: 25565
    #   texture_url: "" # Optional textures.minecraft.net player-head URL

autorestart:
  enabled: false
  interval_hours: 24
  now_delay_seconds: 10
  warning_seconds: [3600, 1800, 900, 600, 300, 60, 30, 15, 10, 5, 4, 3, 2, 1]

announcements:
  enabled: true
  interval_seconds: 180
  worlds: [] # Empty targets the lobby. "*" targets every world.
  shuffle: true # False rotates through the list in order.
  exclude_duels: true
  exclude_lava_rising: true
  messages:
    - "&7Use &f/quickqueue &7to join an active queue."
    - "&7Use &f/friends &7to manage your friends list."
    - "&7Edit your layout with &f/customkit &7and preferences with &f/settings&7."

# Optional alternate arena backend. Install a compatible PolarPaper build first.
use_polar_worlds: false
polar_preload: 2

teleports:
  requests:
    expiry_seconds: 30 # /tpa and /tpahere.
  rtp:
    # Targets are XenoWorldReset destination names. List only the destinations you want.
    # Style the inventory using each entry's ID under menus.travel.rtp.buttons in gui.yml.
    destinations:
      - {id: plains-rtp, target: Plains}
      - {id: snowy-rtp, target: Snowy}
      - {id: desert-rtp, target: Desert}
      - {id: badlands-rtp, target: Badlands}
      - {id: mushroom-rtp, target: Mushroom}

combat:
  food_cooldowns:
    RAW_GOLD: 10 # Seconds per item type and player. Set the entry to 0 to disable it.
  creeper_eggs:
    enabled: true # When false, Core leaves spawn eggs to normal server rules.
    consume: true
    fuse_ticks: 20
  legacy_damage_boost_percent: 33 # Applies to the existing 33_percent_boost list.
  kit_damage_boosts: []
  # Example: [{kit: "smp.pot", percent: 20}]. Use 0 to override other boosts for the kit.
  additional_blocked_kit_items: [] # Built-in blocked items are always enforced.

duels:
  tnt_seconds: 3
  default_rounds: 1
  rounds: [1, 2, 3, 4, 5, 10, 15, 18, 20]
  countdown:
    start_seconds: 10
    between_rounds_seconds: 5
    ready_up: true
    between_rounds_ready_window_seconds: 3
    return_delay_ticks: 60
  queue:
    search_ticks: 2
    status_ticks: 20
    match_intro_ticks: 60
  schematic:
    paste_spacing_ticks: 5
    retry_seconds: 2
  polar:
    operation_interval_ticks: 250
  spectating:
    privacy_check_ticks: 20
  telemetry:
    enabled: true # Allow opt-in recording for direct challenges.
    max_round_target: 3

  # Experimental. The practice NPC uses Paper server internals and can break
  # after an update. Test it on a staging server before enabling it.
  bots:
    enabled: false
    max_sessions: 4
    allowed_kits: ["beast", "pot"]
    default_rounds: 1
    debug_logging: false
    defaults:
      name: "PvP Bot"
      invulnerability: true
      sprint_hit_percent: 60
      w_tap_percent: 30
      strafe_percent: 45
      frequent_range: 3.0
      reaction_ticks: 2
      attack_delay_ticks: 10
      move_speed: 0.31
      retreat_speed: 0.26
      close_retreat_speed: 0.16
      max_chase_distance: 80.0
      shield_use_percent: 40
      shield_break_enabled: true
      shield_break_cooldown_ticks: 100
      desync_teleport_distance: 3.5
      aim_speed_degrees: 18.0
      reach_distance: 3.1

ranked:
  webhook_url: "" # VISE_RANKED_WEBHOOK_URL
  report_url_template: "" # Optional URL with a {match_id} placeholder
  placement_matches: 5
  starting_elo: 1000 # Applies when creating new ranked stats.
  countdown_seconds: 10
  rating:
    regular_k: 32
    placement_k: 64
    expected_score_divisor: 400
  tiers:
    points_per_division: 100
    divisions_per_tier: 5
  matchmaking:
    initial_elo_range: 50
    elo_range_increment: 25
    relax_every_seconds: 3
    max_elo_range: 0 # 0 preserves the uncapped Elo window.
  queue:
    search_ticks: 20
    status_ticks: 20
    chat_ticks: 40 # 0 hides repeating ranked queue chat.
    arena_wait_seconds: 30
  telemetry:
    enabled: true
    snapshot_interval_ticks: 20
    ping_interval_ticks: 100
  history_expiry_days: 7

party:
  default_size: 4
  default_shuffle: false
  default_auto_balance: true
  open_cooldown_seconds: 60
  ffa:
    countdown_seconds: 10
    scatter_seconds: 10

cosmetics:
  kill_effects:
    enabled: true
    disabled_effects: []
    unlock_levels: {} # Keys are lowercase effect IDs, such as electric_storm.
    play_sound: true
    volume: 1.5

lava_rising:
  lava_rising_world: lavaevent
  time_finish: 900
  time_pvp: 330
  time_lava_start: 10
  time_lava_rise: 3
  auto_interval_ticks: 0 # Zero disables automatic starts.
  webhook_url: "" # VISE_LAVA_WEBHOOK_URL
  webhook_warn_seconds: 30
  pregame:
    required_players: 5
    spectate_height: 100
    lobby_wait_seconds: 60
    reminder_interval_seconds: 10
  starter_items:
    - ENCHANTING_TABLE
    - BOOKSHELF:8
    - IRON_BLOCK:3
    - GOLD_BLOCK:2
    - APPLE:9
    - OAK_LOG:16
    - COOKED_BEEF:8

tournaments:
  countdown_seconds: 5
  challonge_username: "" # VISE_CHALLONGE_USERNAME
  challonge_api_key: "" # VISE_CHALLONGE_API_KEY

cooldowns:
  bypass: 5
  fly: 2
  gma: 1
  gms: 1
  gmsp: 1
  gmc: 1
  msg: 3
  setspawn: 5
  setspawnitem: 5
  rules: 3
  spawn: 4
  vanish: 1
  seegames: 2
  duel: 10
  duelaccept: 1
  party: 1
  automatecombat: 3
  travel: 3

# List kit IDs to opt into these combat rules.
33_percent_boost: ["pot", "mctiersio.pot"]
mending_rngs: ["subtiers.debuff", "mctierscom.smp", "diamondsmp"]

# Add the words and phrases you want your server's chat filter to block.
bad_words: []

# Legacy logical page size for saved duel and party kit positions. Visual layouts are in gui.yml.
guis:
  duel:
    kitselector:
      rows: 3

# Chat line format.
# Supports PlaceholderAPI and colour codes in *placeholders only*.
chat: "{player}: {chat}"
chat_options:
  colors_permission: core.chat.color
  mentions:
    enabled: true
    highlight: "&e{player}&r"
    sound: BLOCK_NOTE_BLOCK_PLING # Use NONE to silence mention sounds.
    volume: 1.0
    pitch: 2.0


# Player-facing messages and inventory menus are in lang.yml and gui.yml.

permissions:
  bypass: core.bypass
  fly: core.fly
  gmc: core.gmc
  gms: core.gms
  gmsp: core.gmsp
  gma: core.gma
