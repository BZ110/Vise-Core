# Vise Core inventory menus. Run /coreconfig reload after editing.
# Rows can be 1–6. Slots are zero-based. Controls keep their actions when moved.
# Uncomment or add rows, content-slots, background, sounds and custom-buttons per menu.
# The text section holds labels used by code-driven entries before item overrides are applied.
#
# A complete menu example:
# menus:
#   queues:
#     casual:
#       title: "&bPractice &7({1}/{2})"
#       rows: 5
#       content-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25]
#       background:
#         material: BLACK_STAINED_GLASS_PANE
#         name: " "
#       buttons:
#         next:
#           slot: 44
#           material: SPECTRAL_ARROW
#           name: "&aMore kits"
#           lore: ["{lore}"]
#       entries:
#         glow: false
#       custom-buttons:
#         rules:
#           slot: 0
#           material: BOOK
#           name: "&eServer rules"
#           commands: [rules]
#
