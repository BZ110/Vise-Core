# Built-in matchmaking geography. Coordinates are approximate reference points, not host locations.
# Each entry has a pool ID and [latitude, longitude]. Aliases also work as proxy ID prefixes.
# The unqualified pool in each group uses a representative location for broad region labels.
regions:
  eu:
    eu: {point: [50.1, 8.7], aliases: [europe], broad: true} # Frankfurt
    eu-east: {point: [52.2, 21.0], aliases: [eastern-europe, warsaw]}
    eu-central: {point: [50.1, 8.7], aliases: [central-europe, frankfurt]}
    eu-west: {point: [51.5, -0.1], aliases: [western-europe, london]}
    eu-north: {point: [59.3, 18.1], aliases: [northern-europe, stockholm, nordics]}
    eu-south: {point: [45.5, 9.2], aliases: [southern-europe, milan]}
    eu-southeast: {point: [38.0, 23.7], aliases: [southeastern-europe, balkans, athens]}
    eu-southwest: {point: [40.4, -3.7], aliases: [southwestern-europe, iberia, madrid]}
  na:
    na: {point: [41.9, -87.6], aliases: [north-america, northern-america, us, usa], broad: true} # Chicago
    na-east: {point: [40.7, -74.0], aliases: [us-east, north-america-east, new-york]}
    na-central: {point: [41.9, -87.6], aliases: [us-central, north-america-central, chicago]}
    na-west: {point: [34.1, -118.2], aliases: [us-west, north-america-west, los-angeles]}
    na-northwest: {point: [47.6, -122.3], aliases: [us-northwest, seattle]}
    na-south: {point: [32.8, -96.8], aliases: [us-south, north-america-south, dallas]}
    na-north: {point: [45.5, -73.6], aliases: [canada, ca-east, ca-central, montreal]}
    na-mexico: {point: [19.4, -99.1], aliases: [mx, mexico, mexico-city]}
    na-central-america: {point: [9.0, -79.5], aliases: [central-america, panama]}
    na-caribbean: {point: [18.5, -66.1], aliases: [caribbean, san-juan]}
  sa:
    sa: {point: [-23.6, -46.6], aliases: [south-america], broad: true} # São Paulo
    sa-east: {point: [-23.6, -46.6], aliases: [br, brazil, sao-paulo]}
    sa-north: {point: [4.7, -74.1], aliases: [bogota, colombia]}
    sa-central: {point: [-16.5, -68.2], aliases: [la-paz, bolivia]}
    sa-west: {point: [-12.0, -77.0], aliases: [lima, peru]}
    sa-south: {point: [-34.6, -58.4], aliases: [buenos-aires, argentina]}
    sa-southwest: {point: [-33.4, -70.7], aliases: [santiago, chile]}
  middle-east:
    middle-east: {point: [25.2, 55.3], aliases: [me, mena-east, asia-west, west-asia, western-asia], broad: true} # Dubai
    me-east: {point: [25.2, 55.3], aliases: [dubai, uae, gulf]}
    me-west: {point: [41.0, 29.0], aliases: [istanbul, turkiye, turkey]}
    me-central: {point: [24.7, 46.7], aliases: [riyadh, saudi-arabia]}
  asia:
    asia: {point: [1.4, 103.8], aliases: [as, ap, apac], broad: true} # Singapore
    asia-central: {point: [43.2, 76.9], aliases: [central-asia, almaty]}
    asia-east: {point: [35.7, 139.7], aliases: [east-asia, eastern-asia, tokyo, japan, jp]}
    asia-northeast: {point: [37.6, 127.0], aliases: [seoul, korea]}
    asia-north: {point: [55.0, 82.9], aliases: [north-asia, northern-asia, siberia, novosibirsk]}
    asia-south: {point: [19.1, 72.9], aliases: [south-asia, southern-asia, mumbai, india, in]}
    asia-southeast: {point: [1.4, 103.8], aliases: [southeast-asia, south-eastern-asia, singapore, sg]}
    asia-china: {point: [31.2, 121.5], aliases: [china, cn, shanghai]}
    asia-hong-kong: {point: [22.3, 114.2], aliases: [hong-kong, hk]}
  af:
    af: {point: [-26.2, 28.0], aliases: [africa], broad: true} # Johannesburg
    af-north: {point: [30.0, 31.2], aliases: [north-africa, northern-africa, cairo]}
    af-west: {point: [6.5, 3.4], aliases: [west-africa, western-africa, lagos]}
