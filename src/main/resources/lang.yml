# Duel Admin Commands
# Probably don't want to change these, as they act as a guide to serve the player.
duel_admin_begin: "&7Duel‑Setup Wizard\n&f• &e/dueladmin arena <id> &7→ build arenas\n&f• &e/dueladmin kit <id> &7→ make kits"

# ─────────── ARENA GUIDE ───────────
duel_admin_arena: "&7Arena Setup Commands:\n&f✓ &e/dueladmin arena create <id> &7→ Create a new arena\n&f✓ &e/dueladmin arena arenaready <id> &7→ Link the Multiverse world\n&f✓ &e/dueladmin arena setdisplayitem <id> &7→ Set icon in GUI\n&f✓ &e/dueladmin arena setspawn <id> <1|2> &7→ Set team spawn point\n&f✓ &e/dueladmin arena setcorner <id> <x1|z1|x2|z2> <value> &7→ Define arena bounds\n&f✓ &e/dueladmin arena setschematic <id> <file> &7→ Set schematic file\n&f✓ &e/dueladmin arena setoffset <id> <x|z> <blocks> &7→ Set schematic spacing\n&f✓ &e/dueladmin arena setmax <id> <perline|maxarenas> <num> &7→ Set grid size\n&f✓ &e/dueladmin arena info <id> &7→ View full arena info"

duel_admin_arena_proper_name: "&7Specify an arena name."
duel_admin_arena_exists: "&cThat arena already exists."

duel_admin_arena_one: "&a✔ Arena &e{1}&a created\n&f1) Make its world: &e/mv create {1}-duel normal -g VoidGen\n&f2) Unload world: &e/mv unload {1}-duel\nNext ➜ &e/dueladmin arena arenaready {1}"

duel_admin_arena_ready: "&aWorld linked!\nHold the arena icon in your hand.\nNext ➜ &e/dueladmin arena setdisplayitem {1}"

duel_admin_arena_two: "&aIcon saved.\nStand at &9Team‑1 &fspawn.\nNext ➜ &e/dueladmin arena setspawn {1} 1\n\n&r&7To do this, we recommend creating a world called &earenacreation&7 with the command &e/mv create arenacreation -g VoidGen &7- Go to this world, then spawn the schematic at 0, 0, 0. Then use these commands. Ensure you use commands such as /tp and center your yaw and pitch."

duel_admin_arena_setspawn_usage: "&7Usage: /dueladmin arena setspawn <name> <1|2>"
duel_admin_arena_setspawn: "&aTeam‑{1} spawn saved.\nIf the other team is missing, set it next.\nOtherwise stand at a corner of the build area.\nNext ➜ &e/dueladmin arena setcorner {arena} x1 <value>"

duel_admin_arena_setcorner_usage: "&7Usage: /dueladmin arena setcorner <name> <x1|z1|x2|z2> <value>"
duel_admin_arena_setcorner: "&aCorner &d{1}&a = &d{2}\nRepeat for the remaining corners.\nNext ➜ &e/dueladmin arena setschematic {arena} <file>"

duel_admin_arena_setschematic_usage: "&7Usage: /dueladmin arena setschematic <name> <file>"
duel_admin_arena_setschematic: "&aSchematic linked.\nOptional tweaks: offsets or limits.\nType &e/dueladmin arena info {1} &7to review."

# optional tweaks
duel_admin_arena_setoffset_usage: "&7Usage: /dueladmin arena setoffset <name> <x|z> <blocks>"
duel_admin_arena_setoffset: "&aOffset &d{1}&a set to &d{2}"
duel_admin_arena_setmax_usage: "&7Usage: /dueladmin arena setmax <name> <perline|maxarenas> <num>"
duel_admin_arena_setmax: "&aSet &d{1}&a to &d{2}"



# ─────────── KIT GUIDE ───────────
duel_admin_kit: "&7Kit Setup Commands: &f✓ &e/dueladmin kit create <id> &7→ Create a new kit &f✓ &e/dueladmin kit saveinv <id> &7→ Save your inventory &f✓ &e/dueladmin kit setdisplayitem <id> &7→ Set GUI icon &f✓ &e/dueladmin kit setslot <id> <slot> &7→ Set GUI position &f✓ &e/dueladmin kit setbuild <id> <true|false> &7→ Allow block placing &f✓ &e/dueladmin kit setnaturalregen <id> <true|false> &7→ Allow natural regen &f✓ &e/dueladmin kit sethealthindics <id> <true|false> &7→ Toggle health indicators &f✓ &e/dueladmin kit setlosehunger <id> <true|false> &7→ Toggle hunger loss &f✓ &e/dueladmin kit info <id> &7→ View kit details"

duel_admin_kit_proper_name: "&7Specify a kit name."
duel_admin_kit_exists: "&cThat kit already exists."

duel_admin_kit_one: "&a✔ Kit &e{1}&a created.\nFill your inventory with kit items.\nNext ➜ &e/dueladmin kit saveinv {1}"

duel_admin_kit_two: "&aInventory captured.\nHold the kit icon in your hand.\nNext ➜ &e/dueladmin kit setdisplayitem {1}"

duel_admin_kit_three: "&aIcon saved.\nNext ➜ &e/dueladmin kit setslot {1} <slot>"

duel_admin_kit_setslot_usage: "&7Usage: /dueladmin kit setslot <name> <slot>"
duel_admin_kit_four: "&aKit ready!  Slot &d{1}\nType &e/dueladmin kit info {kit} &7to review."

duels_duel_specify: "&7You must specify a player, or that player doesn't exist."
duels_duel_unable: "&7That player is unable to initiate a duel with you."
duel_admin_kit_bool_set: "&aSet &d{1} &ato &d{2}"
duel_admin_kit_bool_usage: "&7Usage: /dueladmin kit {setting} <name> <true|false>"


